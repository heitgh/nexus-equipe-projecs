<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Funcionário</title>
  <style>
    /* Um pequeno estilo apenas para os campos não ficarem grudados */
    label { display: inline-block; width: 100px; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>Cadastro de Funcionário</h2>

  <form action="cadastro.php" method="POST">

    <label for="nome">Nome:</label>
    <input type="text" id="nome" name="nome" required><br>

    <label for="matricula">Matrícula:</label>
    <input type="number" id="matricula" name="matricula" required><br>

    <label for="funcao">Função:</label>
    <input type="text" id="funcao" name="funcao" required><br>

    <label for="departamento">Departamento:</label>
    <input type="text" id="departamento" name="departamento" required><br>
        
    <label for="idade">Idade:</label>
    <input type="number" id="idade" name="idade" required><br>

    <label for="cpf">CPF:</label>
    <input type="text" id="cpf" name="cpf" maxlength="11" required><br>

    <label for="rg">RG:</label>
    <input type="text" id="rg" name="rg" maxlength="9" required><br>

    <label for="salario">Salário:</label>
    <input type="text" id="salario" name="salario" placeholder="Ex: 2500.50" required><br>

    <label for="endereco">Endereço:</label>
    <input type="text" id="endereco" name="endereco" required><br>

    <label for="uf">UF:</label>
    <input type="text" id="uf" name="uf" maxlength="2" required><br>

    <label for="pais">País:</label>
    <input type="text" id="pais" name="pais" placeholder="País" required><br><br>

    <button type="submit">Cadastrar Funcionário</button>

  </form>
</body>
</html>
