<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style/style.css">
  <title>Cadastro de Funcionário</title>
</head>

<body>

  <h1>Cadastro de Funcionário</h1>

<form action="ban_func.php" method="post">

    <div class="formulario">

        <!-- PRIMEIRA LINHA -->
        <div class="campo nome">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome"
                   placeholder="Nome" required>
        </div>


        <!-- SEGUNDA LINHA -->
        <div class="campo">
            <label for="matricula">Matrícula:</label>
            <input type="text" id="matricula" name="matricula"
                   placeholder="Matrícula" required>
        </div>

        <div class="campo">
            <label for="rg">RG:</label>
            <input type="text" id="rg" name="rg"
                   placeholder="00.000.000-0" required>
        </div>


        <!-- TERCEIRA LINHA -->
        <div class="campo">
            <label for="funcao">Função:</label>
            <input type="text" id="funcao" name="funcao"
                   placeholder="Função" required>
        </div>

        <div class="campo">
            <label for="salario">Salário:</label>
            <input type="number" id="salario" name="salario"
                   step="0.01" placeholder="Salário" required>
        </div>


        <!-- QUARTA LINHA -->
        <div class="campo">
            <label for="departamento">Departamento:</label>
            <input type="text" id="departamento" name="departamento"
                   placeholder="Departamento" required>
        </div>

        <div class="campo">
            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" name="endereco"
                   placeholder="Endereço" required>
        </div>


        <!-- QUINTA LINHA -->
        <div class="campo">
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade"
                   placeholder="Idade" required>
        </div>

        <div class="campo">
            <label for="uf">UF:</label>
            <input type="text" id="uf" name="uf"
                   maxlength="2"
                   placeholder="Unidade Federativa" required>
        </div>


        <!-- SEXTA LINHA -->
        <div class="campo">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" name="cpf"
                   placeholder="000.000.000-00" required>
        </div>

        <div class="campo">
            <label for="pais">País:</label>
            <input type="text" id="pais" name="pais"
                   placeholder="País" required>
        </div>

    </div>


    <div class="botoes">
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>
    </div>

</form>

  <footer class="rodape-fogo"></footer>

</body>
</html>
